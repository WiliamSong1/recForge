services:
  api:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    volumes:
      - ./artifacts/run-42:/models:ro
      - profiles:/state
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  profiles:
