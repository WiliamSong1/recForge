[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "recforge"
version = "0.1.0"
description = "Temporally evaluated retrieval and ranking for MovieLens 1M"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch>=2.5,<3", "numpy>=2,<3", "pandas>=2.2,<3", "scikit-learn>=1.5,<2",
  "faiss-cpu>=1.9,<2", "fastapi>=0.115,<1", "uvicorn>=0.30,<1",
  "matplotlib>=3.9,<4", "prometheus-client>=0.21,<1",
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]
experiments = ["mlflow-skinny>=2.17,<4", "optuna>=4,<5"]
[project.scripts]
recforge = "recforge.cli:main"
[tool.setuptools.packages.find]
include = ["recforge*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
